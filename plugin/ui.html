<style>
  :root {
    color-scheme: light dark;
    --text: var(--figma-color-text, #1e1e1e);
    --muted: var(--figma-color-text-secondary, #6b6b6b);
    --faint: var(--figma-color-text-tertiary, #9a9a9a);
    --bg: var(--figma-color-bg, #fff);
    --surface: var(--figma-color-bg-secondary, #f5f5f5);
    --hover: var(--figma-color-bg-hover, rgba(0, 0, 0, .06));
    --border: var(--figma-color-border, #e6e6e6);
    --brand: var(--figma-color-bg-brand, #0d99ff);
    --on-brand: var(--figma-color-text-onbrand, #fff);
    --ok: #14ae5c;
    --wait: #f5a524;
    --bad: #f24822;
  }
  * { box-sizing: border-box; }
  body > * { flex-shrink: 0; }
  html, body { height: 100%; }
  body {
    margin: 0; padding: 12px 12px 10px;
    display: flex; flex-direction: column; gap: 10px;
    font: 11px/16px Inter, system-ui, -apple-system, sans-serif;
    color: var(--text); background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  .card {
    padding: 10px 12px; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--border);
  }
  .head { display: flex; align-items: center; gap: 10px; }
  .indicator { position: relative; width: 10px; height: 10px; flex: none; }
  .indicator::before, .indicator::after {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    background: var(--tone, var(--wait));
  }
  .indicator::after { opacity: 0; }
  .indicator.wait { --tone: var(--wait); }
  .indicator.wait::before { animation: breathe 1.4s ease-in-out infinite; }
  .indicator.on { --tone: var(--ok); }
  .indicator.on::after { animation: ripple 2s cubic-bezier(.2, .6, .4, 1) infinite; }
  .indicator.bad { --tone: var(--bad); }
  @keyframes ripple {
    0% { transform: scale(1); opacity: .55; }
    100% { transform: scale(2.8); opacity: 0; }
  }
  @keyframes breathe { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) {
    .indicator::before, .indicator::after { animation: none !important; }
  }
  #state { font-weight: 600; font-size: 12px; }
  .port {
    margin-left: auto; padding: 1px 6px; border-radius: 4px;
    font-size: 10px; color: var(--muted); border: 1px solid var(--border);
  }
  .where { margin-top: 6px; padding-left: 20px; min-width: 0; }
  .where div { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #file { color: var(--text); }
  #selection { color: var(--muted); }
  #status {
    margin: 0 2px; color: var(--muted); min-height: 32px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  button {
    font: inherit; font-weight: 500; height: 32px; padding: 0 12px;
    border: 0; border-radius: 6px; cursor: pointer;
    background: var(--brand); color: var(--on-brand);
    transition: filter .15s, opacity .15s;
  }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  button:disabled { opacity: .4; cursor: default; }
  #send { width: 100%; }
  #pair { display: none; gap: 8px; }
  input {
    flex: 1; min-width: 0; height: 32px; padding: 0 10px; border-radius: 6px;
    font: inherit; letter-spacing: .08em; text-transform: uppercase;
    border: 1px solid var(--border); background: transparent; color: inherit;
  }
  input:focus { outline: none; border-color: var(--brand); }
  footer {
    margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .links { display: flex; gap: 4px; }
  .icon {
    width: 24px; height: 24px; padding: 0; display: grid; place-items: center;
    background: transparent; color: var(--faint); border-radius: 6px;
  }
  .icon:hover:not(:disabled) { filter: none; background: var(--hover); color: var(--text); }
  .icon svg { width: 14px; height: 14px; fill: currentColor; }
  .copy {
    height: auto; padding: 0; background: none; font-weight: 400;
    font-size: 10px; line-height: 14px; color: var(--faint);
  }
  .copy:hover:not(:disabled) { filter: none; color: var(--text); text-decoration: underline; }
</style>
<section class="card">
  <div class="head">
    <span id="dot" class="indicator wait"></span>
    <span id="state">Connecting…</span>
    <span class="port">:3947</span>
  </div>
  <div class="where">
    <div id="file">Waiting for the file…</div>
    <div id="selection"></div>
  </div>
</section>
<div id="status">Keep this window open while the MCP server works with the file.</div>
<div id="pair">
  <input id="code" placeholder="XXXX-XXXX" maxlength="9" autocomplete="off">
  <button id="save">Pair</button>
</div>
<button id="send" disabled>Save selection as snapshot</button>
<footer>
  <div class="links">

    </button>
    <button class="icon" data-url="https://www.linkedin.com/in/irshad1212" title="LinkedIn" aria-label="LinkedIn">
      <svg viewBox="0 0 24 24"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg>
    </button>
    <button class="icon" data-url="https://www.npmjs.com/package/@irshad.io/figma-local-mcp" title="npm package" aria-label="npm package">
      <svg viewBox="0 0 24 24"><path d="M1.76 0A1.76 1.76 0 0 0 0 1.76v20.48C0 23.21.79 24 1.76 24h20.48c.97 0 1.76-.79 1.76-1.76V1.76C24 .79 23.21 0 22.24 0zM5.13 5.32l13.84.02-.01 13.84H15.5l.01-10.39h-3.46l-.01 10.39H5.11z"/></svg>
    </button>
  </div>
  <button class="copy" data-url="https://www.linkedin.com/in/irshad1212">© irshad.io</button>
</footer>
<script>
  const PORT = 3947;
  const PAIRING_REJECTED = 4401;
  const PAIRING_LOCKED = 4429;
  let socket = null;
  let retry = 500;
  let failures = 0;
  let code = null;
  let waitingForCode = false;

  const dot = document.getElementById('dot');
  const state = document.getElementById('state');
  const file = document.getElementById('file');
  const selection = document.getElementById('selection');
  const status = document.getElementById('status');
  const send = document.getElementById('send');
  const pair = document.getElementById('pair');
  const input = document.getElementById('code');

  function setConnected(on) {
    dot.className = on ? 'indicator on' : 'indicator wait';
    state.textContent = on ? 'Connected' : 'Waiting for MCP server';
    send.disabled = !on;
  }

  function showInfo(info) {
    const sel = info.selection.length === 0 ? 'nothing selected'
      : info.selection.length === 1
        ? info.selection[0].name + ' (' + info.selection[0].id + ')'
        : info.selection.length + ' nodes selected';
    file.textContent = info.fileName + ' / ' + info.currentPage.name;
    selection.textContent = sel;
  }

  function sendJson(obj) {
    if (socket && socket.readyState === WebSocket.OPEN) {
      socket.send(JSON.stringify(obj));
    }
  }

  function askForCode(text) {
    waitingForCode = true;
    pair.style.display = 'flex';
    send.style.display = 'none';
    dot.className = 'indicator bad';
    state.textContent = 'Pairing needed';
    status.textContent = text;
    input.focus();
  }

  function connect() {
    if (waitingForCode) return;
    try {
      socket = new WebSocket('ws://localhost:' + PORT + '/?code=' + encodeURIComponent(code || ''));
    } catch (e) {
      schedule();
      return;
    }
    socket.onopen = function () {
      retry = 500;
      failures = 0;
      pair.style.display = 'none';
      send.style.display = '';
      status.textContent = 'Keep this window open while the MCP server works with the file.';
      setConnected(true);
      parent.postMessage({ pluginMessage: { type: 'hello' } }, '*');
    };
    socket.onmessage = function (event) {
      let msg;
      try { msg = JSON.parse(event.data); } catch (e) { return; }
      if (msg.type === 'request') {
        parent.postMessage({ pluginMessage: msg }, '*');
      } else if (msg.type === 'saved') {
        status.textContent = 'Snapshot saved: ' + msg.name;
      }
    };
    socket.onclose = function (event) {
      setConnected(false);
      if (event.code === PAIRING_REJECTED) {
        askForCode(code
          ? 'The pairing code was not accepted. Ask the agent to run whoami and enter the code it shows.'
          : 'Enter the pairing code. Ask the agent to run whoami to see it.');
        return;
      }
      if (event.code === PAIRING_LOCKED) {
        status.textContent = 'Too many wrong codes. Trying again in a minute.';
        setTimeout(connect, 60000);
        return;
      }
      failures++;
      if (failures === 5) {
        status.textContent = 'No MCP server on port ' + PORT + '. Start an ' +
          'agent session with the server; if one is running, ask it to run ' +
          'whoami.';
      }
      schedule();
    };
    socket.onerror = function () { /* onclose follows */ };
  }

  function schedule() {
    setTimeout(connect, retry);
    retry = Math.min(retry * 2, 4000);
  }

  document.getElementById('save').onclick = function () {
    code = input.value.trim().toUpperCase();
    parent.postMessage({ pluginMessage: { type: 'savePairing', code: code } }, '*');
    waitingForCode = false;
    pair.style.display = 'none';
    send.style.display = '';
    status.textContent = 'Pairing…';
    connect();
  };
  input.onkeydown = function (e) {
    if (e.key === 'Enter') document.getElementById('save').click();
  };

  send.onclick = function () {
    status.textContent = 'Reading selection…';
    parent.postMessage({ pluginMessage: { type: 'snapshot' } }, '*');
  };

  document.querySelectorAll('[data-url]').forEach(function (link) {
    link.onclick = function () {
      parent.postMessage({ pluginMessage: { type: 'open', url: link.dataset.url } }, '*');
    };
  });

  onmessage = function (event) {
    const msg = event.data.pluginMessage;
    if (!msg) return;
    if (msg.type === 'pairing' && code === null) {
      code = msg.code || '';
      connect();
    }
    if (msg.type === 'response') sendJson(msg);
    if (msg.type === 'selection') {
      showInfo(msg.info);
      sendJson({ type: 'info', info: msg.info });
    }
    if (msg.type === 'snapshot') {
      status.textContent = 'Sending snapshot…';
      sendJson({ type: 'snapshot', data: msg.data });
    }
    if (msg.type === 'status') status.textContent = msg.text;
  };
</script>
